<!DOCTYPE html>

<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Узбекский Ресейл</title>

<style>

*{box-sizing:border-box}html,body{background:#fff!important;color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}button,input{font:inherit}.app{max-width:600px;margin:auto;padding-bottom:90px}header,.section{padding:18px 16px}.logo{text-align:center;font-weight:900;font-size:22px}.search{width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;background:#f2f2f4}.page{display:none}.page.active{display:block}.hero{margin:0 16px 20px;padding:24px;height:160px;border-radius:22px;background:#111;color:#fff;display:flex;align-items:flex-end}.filters{display:flex;gap:8px;overflow:auto}.filter{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:30px}.filter.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{position:relative}.photo{height:190px;background:#f2f2f2;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:52px}.heart{position:absolute;right:8px;top:8px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px}.badge{display:inline-block;margin-top:7px;background:#111;color:#fff;border-radius:6px;padding:4px 7px;font-size:10px}.name{font-weight:800;margin-top:5px}.meta{font-size:12px;color:#777}.price{font-weight:900;margin-top:4px}.empty{text-align:center;color:#777;padding:55px 10px}.cartrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.cartpic{width:65px;height:65px;background:#eee;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:30px}.grow{flex:1}.remove{border:0;border-radius:50%;width:36px;height:36px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:22px 0}.btn{width:100%;padding:16px;border-radius:14px;font-weight:800}.black{background:#111;color:#fff;border:0}.white{background:#fff;color:#111;border:1px solid #111}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);padding:9px 2px 15px;z-index:20}.nav{border:0;background:transparent;color:#888;font-size:10px}.nav.active{color:#111;font-weight:900}.icon{display:block;font-size:21px}.overlay{display:none;position:fixed;inset:0;background:#fff;z-index:50;overflow:auto}.overlay.open{display:block}.inner{max-width:600px;margin:auto;padding:16px 18px 45px}.back{border:0;border-radius:50%;width:44px;height:44px;font-size:21px}.bigphoto{height:340px;background:#eee;margin:15px -18px;display:flex;align-items:center;justify-content:center;font-size:100px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.success{text-align:center;padding:60px 10px}.profile{text-align:center;padding:45px 20px}.avatar{width:90px;height:90px;border-radius:50%;background:#111;color:#fff;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px}

</style><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>

<div class="app"><header><div class="logo">УЗБЕКСКИЙ РЕСЕЙЛ</div><input id="search" class="search" placeholder="🔎 Поиск вещей"></header>

<section id="home" class="page active"><div class="hero"><h1>Найди свою следующую вещь.</h1></div><div class="section"><div class="filters" id="filters"><button class="filter active" data-type="Все">Все</button><button class="filter" data-type="Ресейл">♻️ Ресейл</button><button class="filter" data-type="В наличии">🔥 В наличии</button><button class="filter" data-type="Под заказ">🇨🇳 Под заказ</button></div><h2>Новые вещи</h2><div id="homeGrid" class="grid"></div></div></section>

<section id="catalog" class="page"><div class="section"><h1>Каталог</h1><div id="catalogGrid" class="grid"></div></div></section>

<section id="favorites" class="page"><div class="section"><h1>Избранное</h1><div id="favoriteGrid" class="grid"></div></div></section>

<section id="cart" class="page"><div class="section"><h1>Корзина</h1><div id="cartList"></div><div id="cartBottom" style="display:none"><div class="total"><span>Итого</span><span id="total"></span></div><button id="checkoutBtn" class="btn black">Оформить заказ</button></div></div></section>

<section id="profile" class="page"><div class="profile"><div id="profileAvatar" class="avatar">UR</div><h1 id="profileName">Профиль</h1><p id="profileUsername">Узбекский Ресейл</p><p id="profileId" style="display:none"></p><p>📦 Мои заказы</p><p>♻️ Продать вещь — скоро</p></div></section></div>

<nav><button class="nav active" data-page="home"><span class="icon">⌂</span>Главная</button><button class="nav" data-page="catalog"><span class="icon">▦</span>Каталог</button><button class="nav" data-page="favorites"><span class="icon">♡</span>Избранное</button><button class="nav" data-page="cart"><span class="icon">🛍</span>Корзина</button><button class="nav" data-page="profile"><span class="icon">○</span>Профиль</button></nav>

<div id="productView" class="overlay"><div class="inner"><button id="productBack" class="back">←</button><div id="bigPhoto" class="bigphoto"></div><span id="pType" class="badge"></span><h1 id="pName"></h1><h2 id="pPrice"></h2><p id="pSize"></p><p id="pCondition"></p><button id="addBtn" class="btn black">Добавить в корзину</button><br><br><button id="buyBtn" class="btn white">Заказать сейчас</button></div></div>

<div id="checkoutView" class="overlay"><div class="inner"><button id="checkoutBack" class="back">←</button><div id="orderForm"><h1>Оформление заказа</h1><div class="field"><label>Имя *</label><input id="buyerName"></div><div class="field"><label>Телефон *</label><input id="buyerPhone" placeholder="+998"></div><div class="field"><label>Город *</label><input id="buyerCity"></div><div class="field"><label>Комментарий</label><input id="buyerComment"></div><p>Оплата и доставка пока подтверждаются вручную.</p><button id="confirmBtn" class="btn black">Подтвердить заказ</button></div><div id="success" class="success" style="display:none"><h1>✓</h1><h2>Заказ оформлен</h2><p>Мы свяжемся с вами для подтверждения.</p><button id="homeBtn" class="btn black">Вернуться в магазин</button></div></div></div>

<script>

const products=[{id:1,name:"Bootcut Denim Jeans",price:250000,size:"M / 29–30",condition:"10/10",type:"Ресейл",icon:"👖"},{id:2,name:"Cav Empt Box Logo Tee",price:420000,size:"M",condition:"10/10",type:"Ресейл",icon:"👕"},{id:3,name:"Vintage Zip Hoodie",price:390000,size:"L",condition:"9/10",type:"В наличии",icon:"🧥"},{id:4,name:"New Balance 530",price:890000,size:"42",condition:"Новые",type:"Под заказ",icon:"👟"}];

let cart=[],favs=[],selected=null,type="Все",q="";

let telegramUser=null;

let orderSending=false;const $=id=>document.getElementById(id),money=n=>n.toLocaleString("ru-RU")+" сум";

function card(p){const e=document.createElement("div");e.className="card";e.innerHTML=`<div class="photo">${p.icon}</div><button class="heart">${favs.includes(p.id)?"♥":"♡"}</button><span class="badge">${p.type}</span><div class="name">${p.name}</div><div class="meta">Размер: ${p.size}</div><div class="price">${money(p.price)}</div>`;e.querySelector(".heart").onclick=x=>{x.stopPropagation();favs=favs.includes(p.id)?favs.filter(i=>i!==p.id):[...favs,p.id];render()};e.onclick=()=>{selected=p;$("bigPhoto").textContent=p.icon;$("pType").textContent=p.type;$("pName").textContent=p.name;$("pPrice").textContent=money(p.price);$("pSize").textContent="Размер: "+p.size;$("pCondition").textContent="Состояние: "+p.condition;$("productView").classList.add("open")};return e}

function fill(id,list){const b=$(id);b.innerHTML="";if(!list.length){b.innerHTML='<div class="empty">Здесь пока ничего нет</div>';return}list.forEach(p=>b.appendChild(card(p)))}

function render(){const list=products.filter(p=>(type==="Все"||p.type===type)&&p.name.toLowerCase().includes(q.toLowerCase()));fill("homeGrid",list);fill("catalogGrid",products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())));fill("favoriteGrid",products.filter(p=>favs.includes(p.id)));renderCart()}

function renderCart(){const b=$("cartList");b.innerHTML="";if(!cart.length){b.innerHTML='<div class="empty">Корзина пока пустая 🛍</div>';$("cartBottom").style.display="none";return}$("cartBottom").style.display="block";cart.forEach(p=>{const r=document.createElement("div");r.className="cartrow";r.innerHTML=`<div class="cartpic">${p.icon}</div><div class="grow"><b>${p.name}</b><div class="meta">${p.size}</div><div class="price">${money(p.price)}</div></div><button class="remove">×</button>`;r.querySelector(".remove").onclick=()=>{cart=cart.filter(x=>x.id!==p.id);renderCart()};b.appendChild(r)});$("total").textContent=money(cart.reduce((s,p)=>s+p.price,0))}

function add(p){if(!cart.some(x=>x.id===p.id))cart.push(p);renderCart()}

function page(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===id));window.scrollTo(0,0);render()}

function checkout(){if(!cart.length)return;$("orderForm").style.display="block";$("success").style.display="none";$("checkoutView").classList.add("open")}

document.querySelectorAll(".nav").forEach(x=>x.onclick=()=>page(x.dataset.page));

document.querySelectorAll(".filter").forEach(x=>x.onclick=()=>{document.querySelectorAll(".filter").forEach(y=>y.classList.remove("active"));x.classList.add("active");type=x.dataset.type;render()});

$("search").oninput=e=>{q=e.target.value;render()};$("productBack").onclick=()=>$("productView").classList.remove("open");

$("addBtn").onclick=()=>{add(selected);$("productView").classList.remove("open");page("cart")};$("buyBtn").onclick=()=>{add(selected);$("productView").classList.remove("open");checkout()};

$("checkoutBtn").onclick=checkout;$("checkoutBack").onclick=()=>$("checkoutView").classList.remove("open");

$("confirmBtn").onclick=async()=>{

 const name=$("buyerName").value.trim();

 const phone=$("buyerPhone").value.trim();

 const city=$("buyerCity").value.trim();

 const comment=$("buyerComment").value.trim();

 

 if(!name){alert("Введите имя");return}

 if(!phone){alert("Введите телефон");return}

 if(!city){alert("Введите город");return}

 if(!cart.length){alert("Корзина пуста");return}

 if(orderSending)return;

 

 const btn=$("confirmBtn");

 orderSending=true;

 btn.disabled=true;

 btn.textContent="Отправляем заказ...";

 

 const total=cart.reduce((s,p)=>s+p.price,0);

 const tgName=telegramUser

   ? [telegramUser.first_name,telegramUser.last_name].filter(Boolean).join(" ")

   : "";

 const tgUsername=telegramUser&&telegramUser.username

   ? "@"+telegramUser.username

   : "";

 

 const payload={

   name,

   phone,

   city,

   comment,

   items:cart.map(p=>({

     id:p.id,

     name:p.name,

     price:p.price,

     size:p.size,

     type:p.type

   })),

   total,

   telegramName:tgName,

   telegramUsername:tgUsername,

   telegramId:telegramUser?String(telegramUser.id||""):""

 };

 

 try{

   const response=await fetch("https://uzbek-resale-orders.amegakid.workers.dev/",{

     method:"POST",

     headers:{"Content-Type":"application/json"},

     body:JSON.stringify(payload)

   });

 

   const result=await response.json().catch(()=>({ok:false}));

 

   if(!response.ok||!result.ok){

     throw new Error(result.error||"Order send failed");

   }

 

   $("orderForm").style.display="none";

   $("success").style.display="block";

   cart=[];

   renderCart();

 

 }catch(error){

   console.error(error);

   alert("Не удалось отправить заказ. Проверьте интернет и попробуйте ещё раз.");

 }finally{

   orderSending=false;

   btn.disabled=false;

   btn.textContent="Подтвердить заказ";

 }

};

$("homeBtn").onclick=()=>{$("checkoutView").classList.remove("open");["buyerName","buyerPhone","buyerCity","buyerComment"].forEach(id=>$(id).value="");page("home")};

 

function initTelegram(){

  const tg = window.Telegram && window.Telegram.WebApp;

  if(!tg) return;

 

  try{

    tg.ready();

    tg.expand();

 

    if(tg.setHeaderColor) tg.setHeaderColor("#ffffff");

    if(tg.setBackgroundColor) tg.setBackgroundColor("#ffffff");

    if(tg.setBottomBarColor) tg.setBottomBarColor("#ffffff");

 

    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;

    if(!u) return;

    telegramUser = u;

 

    const fullName = [u.first_name, u.last_name].filter(Boolean).join(" ") || "Профиль";

    const initials = [u.first_name, u.last_name]

      .filter(Boolean)

      .map(x => x.charAt(0))

      .join("")

      .slice(0,2)

      .toUpperCase() || "UR";

 

    $("profileName").textContent = fullName;

    $("profileAvatar").textContent = initials;

    $("profileUsername").textContent = u.username ? "@"+u.username : "Telegram пользователь";

    $("profileId").textContent = String(u.id || "");

  }catch(e){

    console.log("Telegram init error", e);

  }

}

 

initTelegram();

render();

</script></body></html>
